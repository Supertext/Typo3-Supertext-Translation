name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: HTML round-trip test
        run: php Tests/HtmlDocumentTest.php

  # Deploys to the TYPO3 demo on every push to main.
  # Repository secrets (Settings > Secrets and variables > Actions):
  #   DEPLOY_HOST        e.g. 149.126.4.97
  #   DEPLOY_USER        SSH user
  #   DEPLOY_SSH_KEY     private key (its public key in ~/.ssh/authorized_keys on the server)
  #   DEPLOY_PATH        TYPO3 project root (the folder with composer.json), e.g. /home/user/www/typo3-translation
  # Optional: DEPLOY_PORT (22), DEPLOY_PHP (php), DEPLOY_COMPOSER (composer, or e.g. "php composer.phar"), DEPLOY_KNOWN_HOSTS
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-demo
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      TARGET: ${{ secrets.DEPLOY_PATH }}
      PHP: ${{ secrets.DEPLOY_PHP || 'php' }}
      COMPOSER: ${{ secrets.DEPLOY_COMPOSER || 'composer' }}
      HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$TARGET" ] || [ "$HAS_KEY" != "true" ]; then
            echo "Deploy secrets not configured yet - skipping deploy."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Upload extension
        if: steps.check.outputs.skip != 'true'
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy -p $PORT" \
            ./ "$USER@$HOST:$TARGET/packages/supertext_translation/"

      - name: Install & flush caches
        if: steps.check.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" bash -se <<EOS
          set -e
          cd "$TARGET"
          if ! $COMPOSER show supertext/typo3-translation >/dev/null 2>&1; then
            $COMPOSER require --no-interaction --no-progress supertext/typo3-translation:@dev
          else
            $COMPOSER dump-autoload --no-interaction
          fi
          $PHP vendor/bin/typo3 extension:setup -e supertext_translation
          $PHP vendor/bin/typo3 cache:flush
          echo "Deployed \$(date)"
          EOS
