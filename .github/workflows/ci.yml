name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: HTML round-trip test
        run: php Tests/HtmlDocumentTest.php
      - name: Interface translations test
        run: php Tests/LanguageFilesTest.php
      - name: Demo entrypoint syntax
        run: sh -n demo/entrypoint.sh
